[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vmd-eog-research"
version = "0.1.0"
requires-python = ">=3.10"
description = "Kaggle-executed regional EOG correction research"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
