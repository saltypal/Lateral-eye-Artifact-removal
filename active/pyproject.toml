[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "klados-osf-eog"
version = "0.1.0"
requires-python = ">=3.10"
description = "Readable Klados/OSF-only ocular artifact comparison"
dependencies = ["numpy>=2.1,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "pymatreader==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
